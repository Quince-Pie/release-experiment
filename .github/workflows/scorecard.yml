# OpenSSF Scorecard: independent, continuous measurement of this repository's
# supply-chain posture (pinned dependencies, token permissions, signed
# releases, branch protection, dangerous workflows, ...). Results go to the
# code-scanning tab and to the public Scorecard API for the README badge.
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "33 5 * * 2"
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: OpenSSF Scorecard
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read # checkout
      security-events: write # upload the SARIF results to code scanning
      id-token: write # publish_results signs the results with the workflow identity
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
