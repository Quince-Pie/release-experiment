# Continuous integration: everything that `nix flake check` covers (build,      - name: Compare
        run: |
          diff assets-ubuntu-24.04/SHA256SUMS assets-ubuntu-24.04-arm/SHA256SUMS
          echo "x86_64 and arm64 builders produced identical release assets:"
          cat assets-ubuntu-24.04/SHA256SUMS

  changelog:
    name: Changelog entry
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # checkout
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require a CHANGELOG.md change (label skip-changelog to opt out)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SKIP: ${{ contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
        run: |
          if [ "$SKIP" = "true" ]; then
            echo "skip-changelog label present"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          if git diff --name-only "$BASE_SHA" HEAD | grep -qx CHANGELOG.md; then
            echo "CHANGELOG.md updated"
          else
            echo "::error file=CHANGELOG.md::Add an entry under [Unreleased] or label the pull request skip-changelog"
            exit 1
          fi

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # checkout
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix (pinned, first-party)
        run: scripts/install-nix.sh
      - name: Scan for known vulnerabilities reachable from the code
        run: nix run .#vulncheck

  audit-workflows:
    name: zizmor (online audits)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # checkout
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix (pinned, first-party)
        run: scripts/install-nix.sh
      - name: Audit workflows, including impostor-commit and known-vulnerable-action checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: nix run .#audit-workflows
