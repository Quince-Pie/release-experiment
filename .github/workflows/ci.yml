# Continuous integration: everything that `nix flake check` covers (build,
# tests, vet, formatting, changelog structure, shell and workflow linting),
# plus the release assets built and rebuilt for determinism on two CPU
# architectures whose outputs must be identical.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Authenticated fetches of github: flake inputs avoid the shared rate limit.
  NIX_CONFIG: "access-tokens = github.com=${{ github.token }}"

jobs:
  check:
    name: nix flake check
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read # checkout
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix (pinned, first-party)
        run: scripts/install-nix.sh
      - name: Check
        run: nix flake check --print-build-logs
      - name: Build release assets
        run: nix build .#release-assets --print-build-logs --out-link assets
      - name: Rebuild and require identical output
        run: nix build .#release-assets --rebuild
      - name: Upload SHA256SUMS
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SHA256SUMS-${{ matrix.runner }}
          path: assets/SHA256SUMS
          if-no-files-found: error

  reproducible:
    name: Cross-architecture reproducibility
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Download SHA256SUMS from both builders
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: SHA256SUMS-*
      - name: Compare
        run: |
          diff SHA256SUMS-ubuntu-24.04/SHA256SUMS SHA256SUMS-ubuntu-24.04-arm/SHA256SUMS
          echo "x86_64 and arm64 builders produced identical release assets:"
          cat SHA256SUMS-ubuntu-24.04/SHA256SUMS

  changelog:
    name: Changelog entry
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # checkout
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require a CHANGELOG.md change (label skip-changelog to opt out)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SKIP: ${{ contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
        run: |
          if [ "$SKIP" = "true" ]; then
            echo "skip-changelog label present"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          if git diff --name-only "$BASE_SHA" HEAD | grep -qx CHANGELOG.md; then
            echo "CHANGELOG.md updated"
          else
            echo "::error file=CHANGELOG.md::Add an entry under [Unreleased] or label the pull request skip-changelog"
            exit 1
          fi

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # checkout
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix (pinned, first-party)
        run: scripts/install-nix.sh
      - name: Scan for known vulnerabilities reachable from the code
        run: nix run .#vulncheck

  audit-workflows:
    name: zizmor (online audits)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # checkout
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix (pinned, first-party)
        run: scripts/install-nix.sh
      - name: Audit workflows, including impostor-commit and known-vulnerable-action checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: nix run .#audit-workflows
